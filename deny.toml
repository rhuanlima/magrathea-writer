# Configuration for cargo-deny (license & security auditing)
# Reference: https://embarkstudios.github.io/cargo-deny/

[licenses]
allow = [
  "AGPL-3.0",
  "GPL-3.0",
  "LGPL-3.0",
  "MPL-2.0",
  "Apache-2.0",
  "MIT",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "OFL-1.1",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "CC0-1.0",
  "Zlib",
  "BSL-1.0",
  "OpenSSL",
]
confidence-threshold = 0.8

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
