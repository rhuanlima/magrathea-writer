[package]
name = "magrathea-writer"
version = "0.1.0"
description = "Distraction-free offline encrypted literary studio"
authors = ["Rhuan Lima"]
edition = "2021"
license = "AGPL-3.0-or-later"

[lib]
name = "magrathea_writer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
